[workspace]
resolver = "3"
members = ["crates/git-vendor", "crates/git-set-attr"]

[workspace.package]
edition = "2024"
publish = true
license = "MIT OR Apache-2.0"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

[workspace.dependencies]
clap = { version = "4.5.60", features = ["derive"] }
clap_mangen = "0.2.31"
gix = { version = "0.83", features = ["merge", "tree-editor", "blocking-network-client", "worktree-mutation"] }
gix-glob = "0.26.0"
tempfile = "3"
thiserror = "2"
